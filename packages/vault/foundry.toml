# Foundry project for spDEX's three contracts: the auto-buy vault, its factory,
# and the batcher that triggers many vaults' buys in one transaction.
#
# The settings below are chosen so that a build is byte-identical on any
# machine, because the factory's and the batcher's addresses are pure functions
# of their bytecode (each is deployed through the deterministic deployer with a
# fixed salt) and the app and the keeper ship the addresses they expect. Anyone
# can rebuild from this source and check those addresses;
# `pnpm --filter @spdex/vault check:artifacts` does exactly that against the
# committed src/artifacts.ts and deployments.json.

[profile.default]
src = "contracts"
test = "test/forge"
out = "out"
cache_path = "cache"
libs = []

# One compiler, pinned by version: a silently different compiler is a silently
# different factory and batcher address. Where it is not installed, forge fetches the
# official build and checks its published checksum. scripts/forge.mjs and
# scripts/build-artifacts.mjs use the solc on PATH instead when it is exactly
# this build (see scripts/solc.mjs), so a machine that has it never downloads.
solc_version = "0.8.33"
auto_detect_solc = false

optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# No metadata hash and no CBOR trailer. Both embed a hash of the metadata JSON,
# which includes source paths and comments, so two honest builds from
# differently laid-out checkouts would otherwise produce different bytecode.
bytecode_hash = "none"
cbor_metadata = false

# The fork tests read SPDEX_FORK_RPC_URL (an archive endpoint) from the
# environment and fork mainnet at the pinned block themselves. They never touch
# the shared local fork on :8545.
fs_permissions = []

# Every test runs as one transaction, and the gas tests measure a call's own
# gas, as the batcher's call to a vault spends it: EXECUTE_GAS, BATCH_FIXED_GAS
# and the per-buy figures in src/fee.ts are budgets of that kind. Isolate mode
# (Foundry's default from 1.8) runs each top-level call as a transaction of its
# own, so its readings add a transaction's base cost and turn storage the test
# had touched cold again, and a call can't exceed one transaction's gas. Whole
# transactions are measured on Ethereum by the mainnet smoke suite instead.
isolate = false

[lint]
# A vault's whole job is to act on a schedule, so it compares block.timestamp by
# design. What a block producer can do with that — nudge a timestamp by seconds —
# moves a buy within its window, never adds one: each window allows one buy, and
# the price floor is a ten-minute average that a few seconds cannot shift.
exclude_lints = ["block-timestamp"]
# Lint what ships. The tests move tokens they minted a line earlier and cast
# values they just computed; annotating each would be noise, not safety.
ignore = ["test/**/*.sol"]
